name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile is committed yet; run `npm install` locally and commit package-lock.json, then switch to `npm ci`.
      - name: Latest versions (info)
        run: npm view agents peerDependencies peerDependenciesMeta; for p in agents @modelcontextprotocol/server @modelcontextprotocol/sdk zod wrangler typescript tsx; do echo "$p $(npm view $p version)"; done
      - run: npm install
      - run: npm ls --depth=0
      - run: npm run typecheck
      - run: npm test
      - name: Bundle (wrangler dry run, no deploy, no secrets needed)
        run: npm run build
